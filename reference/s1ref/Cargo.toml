[package]
name = "s1ref"
version = "0.1.0"
edition = "2018"

# Native reference harness around the MinuteLabs evolution-simulator core
# (https://github.com/minutelabsio/evolution-simulator, commit 55af956, GPL-3.0).
# The simulation modules are compiled straight from the cloned source via #[path].

[dependencies]
nalgebra = { version = "0.18", features = ["serde-serialize"] }
serde = "^1.0.59"
serde_derive = "^1.0.59"
serde_json = "1"
rand = { version = "0.6.1" }
uuid = { version = "0.8", features = ["serde", "v4"] }

[profile.release]
opt-level = 3
